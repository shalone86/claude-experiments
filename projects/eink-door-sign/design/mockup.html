<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#e9e7e2;font-family:"Noto Sans","DejaVu Sans",sans-serif;padding:40px;display:flex;flex-direction:column;gap:28px;align-items:center}
.row{display:flex;gap:40px}
.dev{background:#2b2b2b;border-radius:34px;padding:28px 22px 110px;box-shadow:0 8px 24px #0003;position:relative}
.dev::after{content:"";position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:140px;height:34px;border-radius:17px;background:#3a3a3a}
.scr{width:268px;height:362px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:1px;text-align:center}
.lab{text-align:center;color:#444;margin-top:12px;font-size:18px}
.dot{width:46px;height:46px;border-radius:50%;background:#e02424;margin-bottom:18px}
.k .scr{filter:saturate(.45) brightness(1.08) contrast(.9)}
h2{margin:0;font-weight:600;color:#333;font-size:20px}
</style></head><body>
<h2>Design colors</h2>
<div class="row">
 <div><div class="dev"><div class="scr" style="background:#c81e1e;font-size:72px">BUSY</div></div><div class="lab">Busy</div></div>
 <div><div class="dev"><div class="scr" style="background:#111;font-size:40px"><div class="dot"></div>RECORDING</div></div><div class="lab">Recording</div></div>
 <div><div class="dev"><div class="scr" style="background:#1e8c3c;font-size:72px">FREE</div></div><div class="lab">Free</div></div>
 <div><div class="dev"><div class="scr" style="background:#28406e;font-size:38px;line-height:1.15">BACK AT<br>3:30</div></div><div class="lab">Custom</div></div>
</div>
<h2>Roughly how it'll look on the color e-ink screen (more muted)</h2>
<div class="row k">
 <div><div class="dev"><div class="scr" style="background:#c81e1e;font-size:72px">BUSY</div></div></div>
 <div><div class="dev"><div class="scr" style="background:#111;font-size:40px"><div class="dot"></div>RECORDING</div></div></div>
 <div><div class="dev"><div class="scr" style="background:#1e8c3c;font-size:72px">FREE</div></div></div>
 <div><div class="dev"><div class="scr" style="background:#28406e;font-size:38px;line-height:1.15">BACK AT<br>3:30</div></div></div>
</div>
</body></html>
