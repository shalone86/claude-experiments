<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.svg">
<title>Linework</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="btnMenu" title="Library">☰</button>
  <div id="title">Linework</div>
  <button id="btnUndo" title="Undo">↶</button>
  <button id="btnRedo" title="Redo">↷</button>
  <button id="btnDone" class="primary" title="Finish">✓</button>
</header>

<main id="stage">
  <div id="world">
    <img id="ref" alt="" draggable="false">
    <svg id="ink" xmlns="http://www.w3.org/2000/svg"><g id="strokes"></g><path id="live"/></svg>
  </div>
  <div id="empty" hidden>
    <p>Nothing to draw yet.</p>
    <button id="btnAdd2" class="primary">Add pictures</button>
  </div>
</main>

<footer id="bottom">
  <label>Size <input id="size" type="range" min="0.5" max="12" step="0.1" value="2"><output id="sizeOut"></output></label>
  <label>Stabilize <input id="stab" type="range" min="0" max="100" step="1" value="40"><output id="stabOut"></output></label>
  <label>Ref <input id="opacity" type="range" min="0" max="100" value="50"></label>
  <button id="btnFit" title="Fit">⤢</button>
  <button id="btnSkip" title="Skip / next random">⏭</button>
</footer>

<dialog id="dlgDone">
  <form method="dialog" id="doneForm">
    <h2>Finish drawing</h2>
    <label>Title <input id="fTitle"></label>
    <label>Description <textarea id="fDesc" rows="3"></textarea></label>
    <label>Tags (comma separated) <input id="fTags"></label>
    <label class="row"><input type="checkbox" id="fBg"> White background in SVG</label>
    <div class="btns">
      <button value="cancel">Back</button>
      <button id="btnDownload" type="button">Download SVG</button>
      <button id="btnPublish" type="button">Publish</button>
      <button id="btnSave" type="button" class="primary">Save &amp; next</button>
    </div>
    <p id="doneMsg" class="msg"></p>
  </form>
</dialog>

<dialog id="dlgMenu">
  <form method="dialog">
    <h2>Library</h2>
    <p id="stats"></p>
    <div class="btns col">
      <button id="btnAdd" type="button">Add pictures from device…</button>
      <button id="btnGallery" type="button">Finished drawings…</button>
      <button id="btnSettings" type="button">Website settings…</button>
      <button id="btnReset" type="button">Put all pictures back in rotation</button>
      <button value="close">Close</button>
    </div>
  </form>
</dialog>

<dialog id="dlgGallery">
  <form method="dialog">
    <h2>Finished</h2>
    <div id="gal"></div>
    <div class="btns"><button id="btnExportAll" type="button">Export all (JSON)</button><button value="close">Close</button></div>
  </form>
</dialog>

<dialog id="dlgSettings">
  <form method="dialog">
    <h2>Website settings</h2>
    <p class="hint">“Publish” POSTs JSON <code>{id,title,description,tags[],svg}</code> to this URL.</p>
    <label>Endpoint URL <input id="sUrl" type="url" placeholder="https://yoursite.com/api/coloring-pages"></label>
    <label>Auth token (optional) <input id="sToken" type="password"></label>
    <label>Finger draws too <input type="checkbox" id="sFinger"></label>
    <div class="btns"><button value="cancel">Cancel</button><button id="btnSaveSettings" type="button" class="primary">Save</button></div>
  </form>
</dialog>

<input id="file" type="file" accept="image/*" multiple hidden>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
