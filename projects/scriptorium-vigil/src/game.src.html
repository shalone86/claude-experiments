<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#140c07" />
<title>The Scriptorium Vigil</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='10' fill='%23f3e3bf' stroke='%23b8892f' stroke-width='4'/%3E%3Crect x='10' y='10' width='44' height='44' rx='5' fill='%23b5301c'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Georgia,serif' font-size='40' font-weight='bold' fill='%23f4d886'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=EB+Garamond:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — the scriptorium at night. The game is always lit by
   candle, so light and dark schemes share one palette.
   ============================================================ */
:root{
  --wood-0:#120a05; --wood-1:#1f130b; --wood-2:#352113; --wood-3:#57381f; --wood-4:#7a5330;
  --vellum:#f2e6c9; --vellum-2:#e5d3a9; --vellum-3:#cbb284; --vellum-edge:#b89a68;
  --iron:#2b1b0f; --iron-2:#5a4128; --faded:#8a7152;
  --lapis:#1f4fa3; --lapis-2:#5b8de0; --lapis-deep:#13306a;
  --cinnabar:#b5301c; --cinnabar-2:#e8694c; --cinnabar-deep:#6e1a0e;
  --gold:#d3a23b; --gold-2:#f4d886; --gold-deep:#7a5512;
  --verdigris:#3e8b74; --violet:#7d3aa0;
  --glow: rgba(255,186,90,.20);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --glow: rgba(255,186,90,.20); } }
:root[data-theme="dark"]{ --glow: rgba(255,186,90,.20); }

*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wood-0);color:var(--vellum);
  font-family:'EB Garamond',Georgia,serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:default}
#viewport{position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);
  left:env(safe-area-inset-left);right:env(safe-area-inset-right);overflow:hidden;background:var(--wood-0)}

/* ============================================================
   STAGE — a fixed logical canvas scaled to fit any screen.
   Portrait: 400 wide (height flexes). Landscape: 560 tall.
   ============================================================ */
#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;gap:6px;padding:8px;touch-action:none;
  background:
    radial-gradient(ellipse 55% 32% at 50% 14%, var(--glow), transparent 72%),
    radial-gradient(ellipse 120% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(91deg, transparent 0 11px, rgba(0,0,0,.13) 11px 13px, rgba(255,220,170,.025) 13px 23px),
    repeating-linear-gradient(89.3deg, transparent 0 37px, rgba(0,0,0,.10) 37px 40px),
    linear-gradient(180deg,#2c1a0e 0%,#21140b 55%,#170d06 100%);}
#stage.portrait{grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"hud" "shelf" "info" "center" "rack" "actions";
  --tile:48px;--tileH:54px;--vtile:54px;--vtileH:60px;--relicW:50px;--relicH:66px;--scrollW:38px;}
#stage.landscape{grid-template-columns:236px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"hud shelf" "hud center" "info rack" "info actions";
  --tile:56px;--tileH:62px;--vtile:64px;--vtileH:70px;--relicW:74px;--relicH:80px;--scrollW:56px;}
#stage.portrait.phase-shop, #stage.portrait.phase-cash{grid-template-areas:"hud" "shelf" "info" "center" "center" "center"}
#stage.landscape.phase-shop, #stage.landscape.phase-cash{grid-template-areas:"hud shelf" "hud center" "info center" "info center"}
#stage.phase-shop #rack, #stage.phase-shop #actions, #stage.phase-cash #rack, #stage.phase-cash #actions{display:none}

.verse-tools{display:flex;justify-content:center;min-height:30px;margin-top:-2px}
.verse-tools .btn{min-height:30px;padding:0 16px}
.sell-ask .gloss b.v{color:var(--cinnabar-deep)}
.sell-ask button[disabled]{opacity:.5}
#hud{grid-area:hud} #shelf{grid-area:shelf} #info{grid-area:info} #center{grid-area:center;min-height:0;position:relative}
#rack{grid-area:rack} #actions{grid-area:actions}

/* ---------------- HUD ---------------- */
#hud{display:flex;gap:6px;align-items:stretch}
.landscape #hud{flex-direction:column;gap:8px}
.hud-title{display:none;font-family:'UnifrakturMaguntia',serif;font-size:27px;line-height:1;color:var(--gold-2);text-align:center;
  text-shadow:0 2px 0 #000, 0 0 18px rgba(244,216,134,.25);padding:4px 0 0}
.hud-sub{display:none;text-align:center;font-family:'Cinzel';font-size:9px;letter-spacing:.3em;color:var(--faded);margin-top:-4px}
.landscape .hud-title,.landscape .hud-sub{display:block}
.plate{flex:1.25;min-width:0;text-align:left;border-radius:8px;padding:5px 8px;color:var(--iron);
  background:linear-gradient(180deg,var(--vellum),var(--vellum-2));box-shadow:0 2px 0 var(--vellum-edge),0 4px 10px rgba(0,0,0,.5);
  border:1px solid var(--vellum-edge);position:relative}
.plate .pl-top{display:flex;justify-content:space-between;align-items:center;font-family:'Cinzel';font-weight:800;font-size:9px;letter-spacing:.08em;color:var(--cinnabar)}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;border:1px solid var(--iron-2);background:transparent}
.pips i.done{background:var(--verdigris);border-color:var(--verdigris)}
.pips i.cur{background:var(--gold);border-color:var(--gold-deep);box-shadow:0 0 6px var(--gold)}
.pips i.boss{border-radius:2px;transform:rotate(45deg) scale(.85)}
.plate .pl-name{font-family:'Cinzel';font-weight:900;font-size:13px;line-height:1.1;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .pl-target{font-size:12px;line-height:1.15;color:var(--iron-2)}
.plate .pl-target b{font-family:'Cinzel';font-size:19px;color:var(--cinnabar-deep)}
.plate .fat{position:absolute;right:6px;bottom:4px;font-size:10px;font-weight:700;color:var(--cinnabar)}
.scorebox{flex:1;min-width:0;border-radius:8px;padding:4px 8px;background:linear-gradient(180deg,#2a1a0f,#1a100a);
  border:1px solid #5a3d22;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 8px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:center}
.scorebox .lbl{font-family:'Cinzel';font-size:9px;font-weight:800;letter-spacing:.2em;color:var(--gold)}
.scorebox .score{font-family:'Cinzel';font-weight:900;font-size:27px;line-height:1.05;color:var(--vellum);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:#0c0703;overflow:hidden;margin-top:3px;border:1px solid #3a2616}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold-2));transition:width .5s}
.stats{flex:1.15;display:grid;grid-template-columns:1fr 1fr;gap:4px;min-width:0}
.stat{border-radius:6px;background:#1a100a;border:1px solid #4a321c;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px 2px;line-height:1}
.stat .lbl{font-family:'Cinzel';font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--faded)}
.stat b{font-family:'Cinzel';font-weight:900;font-size:21px;line-height:1}
.stat.verses b{color:var(--lapis-2)} .stat.rerolls b{color:var(--cinnabar-2)} .stat.merit b{color:var(--gold-2)}
.stat.menu{font-size:12px;font-family:'Cinzel';font-weight:800;color:var(--vellum-2);background:linear-gradient(180deg,#3b2415,#24160c)}
.landscape .plate,.landscape .scorebox,.landscape .stats{flex:none}
.landscape .plate{padding:8px 10px}
.landscape .plate .pl-name{font-size:16px}
.landscape .plate .pl-target{font-size:14px} .landscape .plate .pl-target b{font-size:20px}
.landscape .scorebox{padding:8px 10px} .landscape .scorebox .score{font-size:32px}
.landscape .stats{grid-template-columns:1fr 1fr;gap:6px}
.landscape .stat{padding:6px 2px} .landscape .stat b{font-size:22px} .landscape .stat .lbl{font-size:9px}
.hud-foot{display:none;gap:6px}
.landscape .hud-foot{display:flex;margin-top:auto}
.landscape .stat.menu{display:none}

/* ---------------- SHELF (relics + scrolls) ---------------- */
#shelf{display:flex;gap:8px;align-items:flex-end;justify-content:center;position:relative;padding:12px 6px 6px;border-radius:8px;
  background:linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.25)),linear-gradient(180deg,#4a2f1a,#3a2414 70%,#2a190d);
  box-shadow:inset 0 2px 0 rgba(255,220,160,.12),inset 0 -3px 0 rgba(0,0,0,.4),0 4px 0 #1a0f07,0 8px 14px rgba(0,0,0,.5)}
.shelf-lbl{position:absolute;top:1px;font-family:'Cinzel';font-size:8px;font-weight:800;letter-spacing:.14em;color:rgba(244,216,134,.65)}
.relic-row{display:flex;gap:5px;position:relative}
.scroll-row{display:flex;gap:4px;padding-left:8px;border-left:1px solid rgba(0,0,0,.45);box-shadow:-1px 0 0 rgba(255,220,160,.08)}
.arc-glow{position:absolute;pointer-events:none;top:-14px;bottom:-6px;border-radius:50% 50% 8px 8px / 40% 40% 8px 8px;
  background:radial-gradient(ellipse 60% 75% at 50% 18%, rgba(255,196,96,.42), rgba(255,170,60,.12) 55%, transparent 80%);
  animation:flick 3.2s infinite ease-in-out}
@keyframes flick{0%,100%{opacity:.85}40%{opacity:1}55%{opacity:.78}70%{opacity:.95}}
.candle{position:absolute;top:-13px;width:8px;height:12px;pointer-events:none;z-index:2}
.candle::before{content:"";position:absolute;left:1px;bottom:0;width:6px;height:5px;border-radius:1px;background:linear-gradient(90deg,#d9c8a0,#fff7df,#cdb88c)}
.candle::after{content:"";position:absolute;left:1px;bottom:5px;width:6px;height:8px;border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;
  background:radial-gradient(circle at 50% 70%,#fff8d6 0 25%,#ffc04d 50%,rgba(255,120,20,.0) 75%);filter:drop-shadow(0 0 4px #ffb347);animation:flame 1.4s infinite ease-in-out;transform-origin:50% 100%}
@keyframes flame{0%,100%{transform:scale(1,1) rotate(-2deg)}30%{transform:scale(.92,1.12) rotate(2deg)}60%{transform:scale(1.05,.95) rotate(-1deg)}}

.slot{position:relative;width:var(--relicW);height:var(--relicH);flex:none}
.slot.scroll-slot{width:var(--scrollW)}
.slot .slot-sell{display:none;position:absolute;left:50%;bottom:-6px;transform:translate(-50%,50%);z-index:30;white-space:nowrap;padding:4px 10px !important;font-size:12px !important}
.slot-sell.ask{background:var(--cinnabar,#b8321f) !important;color:#fff8e6 !important}
.slot-sell[disabled]{opacity:.6}
@media (hover:hover) and (pointer:fine){ .slot .slot-sell{display:block} }
.slot .ghostline{position:absolute;inset:0;border:1.5px dashed rgba(244,216,134,.22);border-radius:50% 50% 6px 6px / 34% 34% 6px 6px;
  display:grid;place-items:center;color:rgba(244,216,134,.28);font-family:'Cinzel';font-size:8px;font-weight:800;letter-spacing:.08em;text-align:center}
.slot.scroll-slot .ghostline{border-radius:6px}
.slot.arc .ghostline{border-color:rgba(255,200,110,.5);color:rgba(255,206,120,.6)}
.slot.hot .ghostline,.vslot.hot .vcell,.drop-hot{outline:2px solid var(--gold-2);outline-offset:2px;border-radius:8px}

.relic,.scroll,.tile,.card{touch-action:none;cursor:grab;position:relative}
.relic{position:absolute;inset:0}
.relic .face{position:absolute;inset:0;border-radius:50% 50% 6px 6px / 34% 34% 6px 6px;padding:4px;
  background:linear-gradient(180deg,#c99a3a,#7a5512);box-shadow:0 4px 0 #2a1a0b,0 6px 10px rgba(0,0,0,.55);
  animation:bob var(--bob,3.2s) ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .15s;display:flex;flex-direction:column}
.glass{flex:1;border-radius:50% 50% 4px 4px / 34% 34% 4px 4px;display:grid;place-items:center;position:relative;overflow:hidden;
  border:2px solid #1a120c;background:var(--gl,#2f62b8);box-shadow:inset 0 0 12px rgba(0,0,0,.55)}
.glass::before{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,transparent 48%,rgba(20,12,6,.75) 48% 52%,transparent 52%),
  linear-gradient(0deg,transparent 62%,rgba(20,12,6,.7) 62% 66%,transparent 66%),
  radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 45%),
  conic-gradient(from 30deg,rgba(255,255,255,.12),rgba(0,0,0,.18),rgba(255,255,255,.1),rgba(0,0,0,.2),rgba(255,255,255,.12))}
.glass .ico{position:relative;font-size:calc(var(--relicW)*.42);filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));line-height:1}
.relic .rname{display:none;font-family:'Cinzel';font-weight:800;font-size:8.5px;line-height:1.05;text-align:center;color:#24170a;padding-top:3px;height:21px;overflow:hidden}
.landscape .relic .rname{display:block}
.relic .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:15px;padding:0 3px;border-radius:8px;font-family:'Cinzel';font-weight:900;font-size:8px;
  display:grid;place-items:center;background:var(--lapis);color:#fff;border:1px solid var(--lapis-2);z-index:2}
.relic.sel .face,.scroll.sel .face{outline:2px solid var(--gold-2);outline-offset:2px}
@media (hover:hover){.relic:hover .face,.scroll:hover .face{transform:translateY(-3px) scale(1.04)}}

.scroll{position:absolute;inset:0}
.scroll .face{position:absolute;inset:6px 0;border-radius:3px;background:linear-gradient(90deg,#d8c393,#f3e7c8 30%,#f3e7c8 70%,#d3bc8a);
  box-shadow:0 3px 0 #6b5230,0 5px 8px rgba(0,0,0,.5);display:grid;place-items:center;animation:bob var(--bob,2.9s) ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .15s}
.scroll .face::before,.scroll .face::after{content:"";position:absolute;left:-3px;right:-3px;height:9px;border-radius:5px;
  background:linear-gradient(180deg,#a8885a,#e8d5a8 45%,#8c6c40)}
.scroll .face::before{top:-6px} .scroll .face::after{bottom:-6px}
.scroll .ico{font-size:calc(var(--scrollW)*.5);line-height:1}
.scroll .wax{position:absolute;bottom:2px;right:2px}

/* ---------------- INFO STRIP (marginalia) ---------------- */
#info{min-height:46px;height:46px;border-radius:6px;padding:4px 8px 4px 10px;display:flex;align-items:center;gap:8px;color:var(--iron);
  background:linear-gradient(180deg,#efe1c0,#dcc89c);border:1px solid var(--vellum-edge);box-shadow:0 3px 8px rgba(0,0,0,.45);position:relative;overflow:hidden}
#info::before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:2px;background:var(--cinnabar);opacity:.55}
.landscape #info{height:auto;min-height:0;align-items:flex-start;flex-direction:column;padding:10px 12px}
.gloss{flex:1;min-width:0;font-size:12.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.landscape .gloss{font-size:14px;-webkit-line-clamp:6}
.gloss b{font-family:'Cinzel';font-weight:900;font-size:11.5px;color:var(--cinnabar-deep);letter-spacing:.02em}
.landscape .gloss b{font-size:13px}
.gloss .tag{font-family:'Cinzel';font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--faded);margin-left:4px}
.gloss em{color:var(--lapis);font-style:normal;font-weight:700}
.gloss .rd{color:var(--cinnabar);font-weight:700}
.gloss-btns{display:flex;gap:5px;flex:none}
.landscape .gloss-btns{margin-top:auto}
.tile.marked{transform:translateY(-10px)}
.tile.marked .face{background:linear-gradient(160deg,#f7d6cc,#e3a493);border-color:var(--cinnabar)}
.tile.marked::after{content:"✕";position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--cinnabar);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.slot.open .ghostline{border-color:var(--gold-2);color:var(--gold-2);animation:slotPulse 1.5s ease-in-out infinite}
@keyframes slotPulse{0%,100%{box-shadow:0 0 0 rgba(244,216,134,0)}50%{box-shadow:0 0 12px rgba(244,216,134,.55);background:rgba(244,216,134,.08)}}
.dragtag{position:absolute;top:5px;right:7px;font-family:'Cinzel';font-weight:900;font-size:8.5px;letter-spacing:.08em;color:var(--gold-deep);background:rgba(211,162,59,.22);border-radius:4px;padding:1px 5px}
.buys{grid-column:2;justify-self:end;align-self:end;margin-top:4px;display:flex;gap:5px}
#info.alms{background:linear-gradient(180deg,#6b4a22,#4a3116);color:var(--gold-2);border-color:var(--gold)}
#info.alms .gloss b{color:var(--gold-2)}
#info.alms.hot{box-shadow:0 0 0 2px var(--gold-2),0 0 18px rgba(244,216,134,.5)}
#info.target{background:linear-gradient(180deg,#dfe7f5,#b9c9e6);border-color:var(--lapis-2)}

/* ---------------- BUTTONS ---------------- */
.btn{border-radius:8px;font-family:'Cinzel';font-weight:900;letter-spacing:.04em;color:#fff;padding:0 12px;min-height:40px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,filter .15s;position:relative;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{filter:grayscale(.7) brightness(.6)}
.btn small{font-family:'EB Garamond';font-weight:700;font-size:12px;opacity:.9}
.btn.lapis{background:linear-gradient(180deg,#3567c2,#1f4fa3);box-shadow:0 3px 0 var(--lapis-deep),0 5px 10px rgba(0,0,0,.45);border:1px solid #6d9be8}
.btn.cinnabar{background:linear-gradient(180deg,#cf4a30,#a72a17);box-shadow:0 3px 0 var(--cinnabar-deep),0 5px 10px rgba(0,0,0,.45);border:1px solid #ee8a70}
.btn.gold{background:linear-gradient(180deg,#e2b452,#b8862a);box-shadow:0 3px 0 var(--gold-deep),0 5px 10px rgba(0,0,0,.45);border:1px solid #f4d886;color:#2b1b0f;text-shadow:none}
.btn.verd{background:linear-gradient(180deg,#4fa58a,#2f7561);box-shadow:0 3px 0 #1c4a3d,0 5px 10px rgba(0,0,0,.45);border:1px solid #8fd3bd}
.btn.wood{background:linear-gradient(180deg,#5a3a20,#3b2514);box-shadow:0 3px 0 #1a0f07,0 5px 10px rgba(0,0,0,.45);border:1px solid #7a5330;color:var(--vellum-2)}
.btn.mini{min-height:28px;padding:0 9px;font-size:10.5px;border-radius:6px}
.btn.mini.lapis,.btn.mini.cinnabar,.btn.mini.gold,.btn.mini.verd,.btn.mini.wood{box-shadow:0 2px 0 rgba(0,0,0,.45)}

/* ---------------- BOOK OF LIFE (play area) ---------------- */
.cover{position:absolute;inset:0;border-radius:10px;padding:6px;
  background:radial-gradient(circle at 30% 20%,#7a2a1c,#4a170e 70%),#4a170e;box-shadow:0 10px 22px rgba(0,0,0,.6),inset 0 0 0 2px #2c0d07,inset 0 0 0 4px rgba(211,162,59,.5)}
.page{position:relative;height:100%;border-radius:4px;color:var(--iron);overflow:hidden;
  background:
    repeating-linear-gradient(180deg,transparent 0 27px,rgba(150,60,40,.10) 27px 28px),
    radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(140,95,40,.30) 100%),
    linear-gradient(90deg,#e4d1a6,#f3e7ca 7%,#f6ecd2 50%,#f3e7ca 93%,#e4d1a6);
  box-shadow:inset 0 0 0 1px rgba(120,80,30,.35);display:flex;flex-direction:column;justify-content:space-evenly;padding:8px 10px}
.page::before{content:"";position:absolute;top:0;bottom:0;left:22px;width:1px;background:rgba(181,48,28,.35)}
.page::after{content:"";position:absolute;top:0;bottom:0;right:22px;width:1px;background:rgba(181,48,28,.35)}
.bk-head{display:flex;align-items:center;gap:8px;position:relative;z-index:1;padding:0 14px}
.initial{width:38px;height:38px;flex:none;border-radius:4px;display:grid;place-items:center;font-family:'UnifrakturMaguntia';font-size:30px;line-height:1;color:var(--gold-2);
  background:linear-gradient(135deg,var(--lapis),var(--lapis-deep));border:2px solid var(--gold);box-shadow:inset 0 0 0 1px var(--cinnabar),0 2px 4px rgba(0,0,0,.3)}
.vtype{font-family:'Cinzel';font-weight:900;font-size:17px;line-height:1;color:var(--cinnabar-deep)}
.vlvl{font-size:12.5px;color:var(--iron-2)}
.vlvl em{font-style:normal;color:var(--lapis);font-weight:700} .vlvl .rd{color:var(--cinnabar);font-weight:700}
.bk-head .spacer{flex:1}
.angel-line{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:40px;position:relative;z-index:1}
.angel{width:36px;height:36px;flex:none;animation:hover 4s ease-in-out infinite}
@keyframes hover{0%,100%{translate:0 0}50%{translate:0 -3px}}
.judgement{font-style:italic;font-size:15px;line-height:1.15;color:var(--iron-2)}
.judgement .word{font-style:normal;font-family:'Cinzel';font-weight:900;color:var(--iron);letter-spacing:.06em}
.judgement.ok .word{color:var(--lapis-deep)} .judgement.bad{color:var(--cinnabar)}
.verse-wrap{display:flex;align-items:center;justify-content:center;gap:4px;position:relative;z-index:1}
.shift{width:22px;height:44px;border-radius:6px;color:var(--iron-2);font-size:16px;font-weight:800;background:rgba(120,80,30,.12)}
.shift:disabled{opacity:.25}
.verse-line{display:flex;gap:5px}
.vslot{display:flex;flex-direction:column;align-items:center;gap:3px}
.vcell{width:var(--vtile);height:var(--vtileH);border-radius:8px;border:1.5px dashed rgba(90,65,40,.4);background:rgba(120,80,30,.07);position:relative;display:grid;place-items:center}
.vcell .tile{--tile:var(--vtile);--tileH:var(--vtileH)}
.vcell .pnum{font-family:'Cinzel';font-size:10px;font-weight:800;color:rgba(90,65,40,.35)}
.vcell.p-gilt{background:linear-gradient(135deg,rgba(211,162,59,.45),rgba(244,216,134,.3));border-color:var(--gold)}
.vcell.p-lapis{background:linear-gradient(135deg,rgba(31,79,163,.35),rgba(91,141,224,.25));border-color:var(--lapis)}
.vcell.p-rubric{background:linear-gradient(135deg,rgba(181,48,28,.35),rgba(232,105,76,.2));border-color:var(--cinnabar)}
.vlabel{font-family:'Cinzel';font-size:8.5px;font-weight:900;letter-spacing:.04em;height:10px;line-height:10px;color:rgba(90,65,40,.5)}
.vlabel.p-gilt{color:var(--gold-deep)} .vlabel.p-lapis{color:var(--lapis)} .vlabel.p-rubric{color:var(--cinnabar)}
.calc{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;z-index:1}
.pigs{display:flex;align-items:center;gap:6px}
.sum{display:flex;align-items:baseline;gap:6px;line-height:1}
.pig{position:relative;width:128px;border-radius:7px;padding:3px 10px;color:#fff;line-height:1;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.pig small{display:block;font-family:'Cinzel';font-size:8.5px;font-weight:800;letter-spacing:.18em;opacity:.85;margin-bottom:2px}
.pig b{font-family:'Cinzel';font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.pig.ink{background:linear-gradient(180deg,#3567c2,#1f4fa3);border:1px solid var(--lapis-deep);text-align:right}
.pig.fervor{background:linear-gradient(180deg,#cf4a30,#a72a17);border:1px solid var(--cinnabar-deep);text-align:left}
.calc .x{font-family:'Cinzel';font-weight:900;font-size:20px;color:var(--cinnabar)}
.calc .eq{font-family:'Cinzel';font-weight:900;font-size:16px;color:var(--iron-2);margin-left:2px}
.calc .total{font-family:'Cinzel';font-weight:900;font-size:22px;color:var(--iron);min-width:56px;font-variant-numeric:tabular-nums}
.landscape .pig{width:156px} .landscape .pig b{font-size:30px} .landscape .calc .total{font-size:28px}
.landscape .vtype{font-size:20px} .landscape .judgement{font-size:17px}
.book-shake{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:5px}60%{translate:-4px}80%{translate:3px}}

.calc .need{font-size:12.5px;font-style:italic;color:var(--iron-2)}
/* ---- blaze: verse will clear the vigil ---- */
.pig.ablaze{box-shadow:0 0 16px 3px rgba(255,140,40,.85),0 3px 0 rgba(0,0,0,.35);animation:blazeGlow .45s ease-in-out infinite alternate}
.pig.ablaze::before,.pig.ablaze::after{content:"";position:absolute;left:6%;right:6%;bottom:55%;height:40px;z-index:-1;pointer-events:none;transform-origin:50% 100%;
  background:radial-gradient(ellipse 50% 100% at 50% 100%,rgba(255,236,150,.95),rgba(255,150,40,.8) 40%,rgba(210,50,10,0) 75%);animation:lick .32s ease-in-out infinite alternate}
.pig.ablaze::after{left:22%;right:22%;height:56px;animation-duration:.27s;animation-delay:-.1s;filter:blur(1px)}
@keyframes lick{from{transform:scale(1,.85) skewX(-4deg)}to{transform:scale(.92,1.15) skewX(5deg)}}
@keyframes blazeGlow{from{filter:brightness(1)}to{filter:brightness(1.18)}}
.censer{position:absolute;left:0;top:0;z-index:47;pointer-events:none;transform-origin:35px 0;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.smoke{position:absolute;z-index:44;pointer-events:none;width:60px;height:60px;border-radius:50%;margin:-30px 0 0 -30px;
  background:radial-gradient(circle,rgba(230,222,205,.55),rgba(200,190,170,.25) 45%,rgba(200,190,170,0) 70%);filter:blur(2px)}
.ember{position:absolute;z-index:46;pointer-events:none;width:4px;height:4px;border-radius:50%;background:#ffcf6a;box-shadow:0 0 6px 2px rgba(255,140,40,.8)}
.flash{position:absolute;inset:0;z-index:43;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(255,210,120,.55),rgba(255,120,40,.0) 70%)}
/* ---- the Treasury (shop): cool verdigris stone vault, gold light ---- */
#stage.phase-shop{background:
    radial-gradient(ellipse 60% 34% at 50% 8%, rgba(244,216,134,.22), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 50%, transparent 45%, rgba(0,0,0,.62) 100%),
    repeating-linear-gradient(0deg, transparent 0 46px, rgba(0,0,0,.20) 46px 48px),
    repeating-linear-gradient(90deg, transparent 0 94px, rgba(0,0,0,.14) 94px 96px),
    linear-gradient(180deg,#16433c 0%,#0f2f2a 60%,#081b18 100%)}
.phase-shop #shelf{box-shadow:inset 0 0 0 999px rgba(20,90,78,.22),inset 0 2px 0 rgba(160,230,210,.12),0 4px 0 #061512,0 8px 14px rgba(0,0,0,.5)}
.phase-shop .plate{background:linear-gradient(180deg,#2f7561,#1c4a3d);border-color:#8fd3bd;color:var(--vellum);box-shadow:0 2px 0 #0c2a22,0 4px 10px rgba(0,0,0,.5)}
.phase-shop .plate .pl-top{color:var(--gold-2)} .phase-shop .plate .pl-target{color:#cfeee4} .phase-shop .plate .pl-target b{color:var(--gold-2)}
.phase-shop .scorebox,.phase-shop .stat{background:#0b2420;border-color:#2f6a5c}
.phase-shop .arc-glow{background:radial-gradient(ellipse 60% 75% at 50% 18%, rgba(244,216,134,.35), rgba(120,220,190,.10) 55%, transparent 80%)}
.phase-shop .tr-title .t2{color:#a9d8c9}
#wipe.shop{background:repeating-linear-gradient(0deg,transparent 0 46px,rgba(0,0,0,.2) 46px 48px),linear-gradient(90deg,#0f2f2a,#1c4a3d 12%,#1c4a3d 88%,#0f2f2a);color:var(--vellum)}
#wipe.shop .w-title{color:var(--gold-2)} #wipe.shop .w-sub{color:#cfeee4} #wipe.shop .w-sup{color:#8fd3bd}
/* ---- the Audit (boss) ---- */
#stage.boss-vigil{background:
    radial-gradient(ellipse 60% 34% at 50% 14%, rgba(255,70,40,.22), transparent 72%),
    radial-gradient(ellipse 120% 80% at 50% 50%, transparent 45%, rgba(0,0,0,.72) 100%),
    repeating-linear-gradient(91deg, transparent 0 11px, rgba(0,0,0,.16) 11px 13px, rgba(255,160,140,.02) 13px 23px),
    linear-gradient(180deg,#2b0f0a 0%,#1c0906 55%,#0e0403 100%)}
.boss-vigil .cover{background:radial-gradient(circle at 30% 20%,#2c2523,#0f0b0a 70%);box-shadow:0 10px 26px rgba(0,0,0,.7),0 0 24px rgba(181,48,28,.35),inset 0 0 0 2px #000,inset 0 0 0 4px rgba(181,48,28,.75)}
.boss-vigil .page{background:
    repeating-linear-gradient(180deg,transparent 0 27px,rgba(150,30,20,.13) 27px 28px),
    radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(130,25,10,.38) 100%),
    linear-gradient(90deg,#dcc29c,#ecdcbc 7%,#efe0c2 50%,#ecdcbc 93%,#dcc29c)}
.boss-vigil .initial{background:linear-gradient(135deg,#8a1f12,#2a0806);border-color:#e8694c}
.boss-vigil .vtype{color:var(--cinnabar)}
.boss-vigil .plate{background:linear-gradient(180deg,#6a1a0e,#3c0b06);border-color:#b5301c;color:var(--vellum);box-shadow:0 2px 0 #250604,0 0 14px rgba(181,48,28,.45)}
.boss-vigil .plate .pl-top{color:var(--gold-2)} .boss-vigil .plate .pl-target{color:var(--vellum-2)} .boss-vigil .plate .pl-target b{color:#ffb39e}
.boss-vigil .arc-glow{background:radial-gradient(ellipse 60% 75% at 50% 18%, rgba(255,90,60,.45), rgba(200,40,20,.14) 55%, transparent 80%)}
.boss-vigil #shelf,.boss-vigil #rack{box-shadow:inset 0 0 0 999px rgba(80,0,0,.18),0 4px 0 #120503,0 8px 14px rgba(0,0,0,.6)}
#wipe.boss{background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(0,0,0,.18) 31px 32px),linear-gradient(90deg,#3a0c07,#5a140c 12%,#5a140c 88%,#3a0c07);color:var(--vellum)}
#wipe.boss .w-title{color:var(--gold-2)} #wipe.boss .w-sub{color:var(--vellum-2)} #wipe.boss .w-sup{color:#ffb39e}

/* ---------------- TILES ---------------- */
.tile{width:var(--tile);height:var(--tileH);flex:none}
.tile .face{position:absolute;inset:0;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(160deg,#fcf3dc 0%,#eddcb4 55%,#d8bf8e 100%);border:1px solid #a88a5c;
  box-shadow:0 3px 0 #8a6a40,0 5px 8px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.75);
  animation:bob var(--bob,3s) ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .15s,box-shadow .15s}
@keyframes bob{0%,100%{translate:0 0;rotate:-.7deg}50%{translate:0 -3px;rotate:.7deg}}
@media (hover:hover){.tile:hover .face{transform:translateY(-4px) scale(1.05)}}
.tile .ltr{font-family:'EB Garamond';font-weight:800;font-size:calc(var(--tile)*.6);line-height:1;color:var(--iron);margin-top:-3px}
.tile.len2 .ltr{font-size:calc(var(--tile)*.44);letter-spacing:-.02em}
.tile.len3 .ltr{font-size:calc(var(--tile)*.34);letter-spacing:-.03em}
.tile .val{position:absolute;right:4px;bottom:2px;font-size:calc(var(--tile)*.21);font-weight:700;color:#6b4f2c;line-height:1}
.tile.c-vowel .ltr{color:var(--cinnabar)}
.tile.c-multi .ltr{color:var(--verdigris)}
.tile.c-di .ltr,.tile.c-tri .ltr{color:var(--lapis)}
.tile.blank .face{background:linear-gradient(160deg,#fffaf0,#efe6d2)}
.tile.blank .ltr{color:rgba(90,65,40,.35)}
.tile.blank .ltr.res{color:var(--lapis);font-style:italic}
.tile.lead .face{background:linear-gradient(160deg,#7c828c,#3e434b);border-color:#2a2e34;box-shadow:0 3px 0 #1c1f24,0 5px 8px rgba(0,0,0,.42)}
.tile.lead .ltr{color:#c9ced6;font-size:calc(var(--tile)*.42)}
.tile.lead .val{color:#c9ced6}
.wax{position:absolute;top:-5px;left:-5px;width:15px;height:15px;border-radius:50%;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.wax.gold{background:radial-gradient(circle at 35% 30%,#fff1b0,#d3a23b 55%,#7a5512)}
.wax.glass{background:radial-gradient(circle at 35% 30%,#e8f4ff,#5b8de0 55%,#13306a)}
.wax.red{background:radial-gradient(circle at 35% 30%,#ffc2b4,#b5301c 55%,#5a1208)}
.wax.cinnabar{background:radial-gradient(circle at 35% 30%,#ffd9a8,#e0702a 55%,#7a3208)}
.tile.s-gold .face{box-shadow:0 3px 0 #8a6a40,0 0 0 2px var(--gold),0 5px 10px rgba(211,162,59,.5)}
.tile.s-glass .face{box-shadow:0 3px 0 #8a6a40,0 0 0 2px var(--lapis-2),0 5px 10px rgba(91,141,224,.5)}
.tile.s-red .face{box-shadow:0 3px 0 #8a6a40,0 0 0 2px var(--cinnabar),0 5px 10px rgba(181,48,28,.5)}
.tile.s-cinnabar .face{box-shadow:0 3px 0 #8a6a40,0 0 0 2px #e0702a,0 5px 10px rgba(224,112,42,.5)}
.tile.targetable .face{animation:bob 3s ease-in-out infinite,pulse 1s infinite}
@keyframes pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px var(--lapis-2)) brightness(1.06)}}
.lifted{opacity:.18}
.lifted .face{animation:none}

/* ---------------- RACK ---------------- */
#rack{position:relative;padding:8px 6px 14px;border-radius:8px;display:flex;justify-content:center;
  background:linear-gradient(180deg,#5b3b22,#43291a 60%,#2e1c10);box-shadow:inset 0 2px 0 rgba(255,220,170,.14),0 3px 0 #170d06,0 8px 14px rgba(0,0,0,.5)}
#rack::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:8px;border-radius:2px 2px 4px 4px;
  background:linear-gradient(180deg,#7a5330,#4a2f1a);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.rack-tiles{display:flex;gap:5px;min-height:var(--tileH);align-items:flex-end;position:relative;z-index:1}
.rack-tiles.tight{gap:0} .rack-tiles.tight .tile{margin:0 -3px}
.rack-empty{color:rgba(244,216,134,.4);font-style:italic;font-size:13px;align-self:center}

/* ---------------- ACTIONS ---------------- */
#actions{display:flex;gap:6px;align-items:stretch}
#actions .btn{min-height:46px}
#actions .grow{flex:1.4}
#actions .reroll{flex:1}
.bagbtn{width:58px;flex:none;border-radius:8px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#7a4a26,#4a2a14);border:1px solid #8a5a30;box-shadow:0 3px 0 #1a0f07,0 5px 10px rgba(0,0,0,.45)}
.bagbtn svg{width:26px;height:22px}
.bagbtn span{font-family:'Cinzel';font-weight:900;font-size:9.5px;color:var(--vellum-2);line-height:1;margin-top:1px}
.sortbtn{width:44px;flex:none;font-size:10px;line-height:1.05;padding:0 4px;flex-direction:column;gap:0}

/* ---------------- SHOP ---------------- */
.treasury{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px}
.tr-head{display:flex;align-items:center;gap:6px}
.tr-title{flex:1;min-width:0;line-height:1}
.tr-title .t1{white-space:nowrap;font-family:'UnifrakturMaguntia';font-size:21px;color:var(--gold-2);text-shadow:0 2px 0 #000}
.tr-title .t2{font-size:11.5px;color:var(--vellum-3);font-style:italic;margin-top:2px}
.tr-grid{flex:1;min-height:0;display:grid;gap:7px;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr))}
.landscape .tr-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-flow:column}
.card{min-width:0;min-height:0}
.card .face{position:absolute;inset:0;border-radius:9px;padding:7px 8px 8px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;column-gap:8px;
  color:var(--iron);background:linear-gradient(180deg,#f2e6c9,#dcc89c);border:1px solid var(--vellum-edge);
  box-shadow:0 4px 0 #6b5230,0 7px 12px rgba(0,0,0,.5);animation:bob var(--bob,3.4s) ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .15s}
@media (hover:hover){.card:hover .face{transform:translateY(-3px)}}
.card.sel .face{outline:2px solid var(--gold-2);outline-offset:2px}
.card .cat{grid-column:1/3;font-family:'Cinzel';font-weight:900;font-size:8.5px;letter-spacing:.14em;color:var(--cinnabar);margin-bottom:3px}
.card .art{grid-row:2/4;width:46px;height:58px;align-self:start;position:relative}
.landscape .card .art{width:56px;height:70px}
.card .art .glass{position:absolute;inset:0;border:3px solid #6b4a16;box-shadow:0 0 0 1px #2a1a0b,inset 0 0 10px rgba(0,0,0,.5)}
.card .art .glass .ico{font-size:24px}
.card .art.sc{border-radius:4px;background:linear-gradient(90deg,#d8c393,#f8eed6 35%,#f8eed6 65%,#d3bc8a);display:grid;place-items:center;box-shadow:0 2px 0 #6b5230;border:1px solid #b89a68}
.card .art.sc .ico{font-size:26px}
.card .art.pen{border-radius:50%;width:46px;height:46px;background:radial-gradient(circle at 35% 30%,#f0a090,#8a1f12 70%);display:grid;place-items:center;border:2px solid #4a0f08}
.card .art.pen .ico{font-size:22px}
.card .cname{font-family:'Cinzel';font-weight:900;font-size:12px;line-height:1.05;color:var(--iron)}
.card .cdesc{font-size:12px;line-height:1.12;color:var(--iron-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;margin-top:2px}
.landscape .card .cname{font-size:13.5px} .landscape .card .cdesc{font-size:13px;-webkit-line-clamp:5}
.card .cbody{min-width:0;min-height:0;overflow:hidden}

.card.sold .face{opacity:.4;filter:grayscale(.6)}
.card.sold .face::after{content:"Received";position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font-family:'Cinzel';font-weight:900;
  color:var(--cinnabar);border:2px solid var(--cinnabar);border-radius:4px;padding:2px 8px;font-size:14px;letter-spacing:.1em}
.card.empty .face{background:rgba(0,0,0,.2);border:1px dashed rgba(244,216,134,.25);box-shadow:none;color:rgba(244,216,134,.4);display:grid;place-items:center;font-style:italic;animation:none}

/* ---------------- CASH-OUT LEDGER ---------------- */
.ledger-wrap{position:absolute;inset:0;display:grid;place-items:center}
.ledger{width:min(100%,360px);border-radius:8px;padding:16px 18px 18px;color:var(--iron);text-align:center;
  background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(150,60,40,.12) 25px 26px),linear-gradient(180deg,#f4e9cf,#e2cfa5);
  box-shadow:0 10px 24px rgba(0,0,0,.6);border:1px solid var(--vellum-edge);animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(30px) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.ledger .l-sup{font-family:'Cinzel';font-weight:900;font-size:10px;letter-spacing:.24em;color:var(--verdigris)}
.ledger h2{font-family:'UnifrakturMaguntia';font-weight:400;font-size:30px;margin:2px 0 10px;color:var(--cinnabar-deep)}
.ledger .row{display:flex;justify-content:space-between;font-size:15px;padding:3px 0;border-bottom:1px dotted rgba(90,65,40,.35)}
.ledger .row b{font-family:'Cinzel';color:var(--gold-deep)}
.ledger .btn{width:100%;margin-top:14px;min-height:46px;font-size:15px}

/* ---------------- MODAL ---------------- */
#modal{position:absolute;inset:0;z-index:40;background:rgba(10,5,2,.78);display:none;align-items:center;justify-content:center;padding:14px}
#modal.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;border-radius:10px;color:var(--iron);overflow:hidden;
  background:linear-gradient(180deg,#f3e7ca,#e2cfa5);border:1px solid var(--vellum-edge);box-shadow:0 16px 40px rgba(0,0,0,.7);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(90,65,40,.25)}
.sheet-head h3{flex:1;margin:0;font-family:'Cinzel';font-weight:900;font-size:15px;color:var(--cinnabar-deep);line-height:1.1}
.sheet-head p{margin:2px 0 0;font-size:12.5px;color:var(--iron-2);font-family:'EB Garamond';font-weight:500}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 12px;border-top:1px solid rgba(90,65,40,.25);display:flex;gap:8px}
.sheet-foot .btn{flex:1}
.tabs{display:flex;gap:4px;padding:8px 12px 0}
.tabs button{flex:1;padding:6px 4px;border-radius:6px 6px 0 0;font-family:'Cinzel';font-weight:800;font-size:11px;background:rgba(90,65,40,.15);color:var(--iron-2)}
.tabs button.on{background:var(--cinnabar);color:#fff}
.bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;--tile:44px;--tileH:50px}
.bag-grid .tile .face{animation:none}
.bag-grid.pick .tile{cursor:pointer}
.bag-grid.pick .tile:hover .face{outline:2px solid var(--lapis);outline-offset:1px}
.bag-sum{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin-bottom:10px;color:var(--iron-2)}
.bag-sum b{font-family:'Cinzel';color:var(--iron)}

.ash{position:absolute;top:-10px;width:3px;height:3px;border-radius:50%;background:rgba(200,205,215,.55);z-index:0;animation:ashfall linear infinite}

.snuffed{width:16px;height:46px;margin:-6px auto 0;position:relative}
.snuffed::before{content:"";position:absolute;bottom:0;left:3px;width:10px;height:30px;border-radius:2px;background:linear-gradient(90deg,#bdb5a2,#efe8d6,#b3ab98)}

.scene .decks button.locked{opacity:.6;border-style:dashed}
.seedrow{display:flex;gap:6px;width:min(100%,330px)}
.seedrow input{flex:1;min-width:0;height:34px;border-radius:7px;border:1px solid rgba(244,216,134,.35);background:rgba(0,0,0,.4);color:var(--gold-2);
  font-family:'Cinzel';font-weight:800;font-size:13px;letter-spacing:.12em;padding:0 10px;-webkit-user-select:text;user-select:text;text-transform:uppercase}

/* tooltip: longer explanation on hover (mouse) or tap (touch) */
#tip{position:absolute;z-index:80;width:max-content;max-width:260px;padding:8px 10px;border-radius:8px;background:linear-gradient(180deg,#fbf3dc,#ecdcb4);color:var(--iron);
  border:1px solid #b89a68;box-shadow:0 6px 18px rgba(0,0,0,.55);font-size:13px;line-height:1.25;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;left:0;top:0}
#tip.show{opacity:1;transform:none}
#tip .now{margin-top:5px;padding-top:4px;border-top:1px solid rgba(90,65,40,.2);font-weight:700;color:var(--lapis)}

#wipe{position:absolute;inset:0;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--iron);

  transform:translateX(calc(-100% - 90px));transition:transform .42s cubic-bezier(.65,0,.35,1);box-shadow:0 0 40px rgba(0,0,0,.8);

<script type="text/plain" id="lexicon">/*__LEXICON__*/</script>
<script>
"use strict";
/* =====================================================================
   LEXICON — ENABLE word list (public domain) + modern 2-letter
   additions, prefix-packed. Scrabble rules: 2+ letters, no proper
   nouns, no abbreviations. House rule: A and I are valid Monads.
   ===================================================================== */
const LEX = (() => {
  const s = (document.getElementById('lexicon').textContent || '').trim();
  const set = new Set(); let prev = '', i = 0; const n = s.length;
  while (i < n) {
    const p = s.charCodeAt(i) - 48; i++;
    let j = i; while (j < n && s.charCodeAt(j) > 57) j++;
    const w = prev.slice(0, p) + s.slice(i, j); set.add(w); prev = w; i = j;
  }
  return set;
})();
const MONADS = ['A','I','O'];
function isWord(w){ if (w.length === 1) return MONADS.includes(w); return LEX.has(w.toLowerCase()); }

/* =====================================================================
   AUDIO
   ===================================================================== */
// ---- Volume: two sliders in the Menu, saved on this device ----
const VOL = {music:.6, sfx:.6};
try{ Object.assign(VOL, JSON.parse(localStorage.getItem('sv_vol')||'{}')); }catch(e){}
// mixing: these scale each slider so music and effects sit at roughly the same loudness
const MIX = {music:.3, sfx:2.2};
function applyVol(){ try{ localStorage.setItem('sv_vol', JSON.stringify(VOL)); }catch(e){}

  ctx:null, muted:false, bus:null,
  out(){ if (!this.bus){ this.bus=this.ctx.createGain(); this.bus.gain.value=VOL.sfx*MIX.sfx; this.bus.connect(this.ctx.destination); } return this.bus; },
  ensure(){ try{ if(!this.ctx){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; this.ctx=new A(); }
    if(this.ctx.state==='suspended' && !document.hidden) this.ctx.resume(); }catch(e){} return this.ctx; },
  tone(f,type,d,v=.07,slide=null){ if(this.muted || VOL.sfx<=0) return; try{
    if(!this.ensure()) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain(), t=this.ctx.currentTime;
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(this.out()); o.start(t); o.stop(t+d);
  }catch(e){} },

// ---- Music: placeholder loops A–F (src/audio), embedded at build time. ----
// optional: H win screen · I lose screen · J Beatitude (loops; without them D/E play)
// A title · G gameplay · B shop · C boss · D choir swell (censer word, victory) · E minor swell (defeat) · F endless gameplay
const MUSIC_SRC = /*__AUDIO__*/{};
// Seconds of music in each loop before its reverb tail: 4 bars at 80 bpm. The tail past this
// point is mixed back over the start, so the echo of the last bar rings into the next pass
// instead of leaving a pause. If you remake a loop at another length, change it here.
const MUSIC_LOOP = {A:12, B:12, C:12, F:12, G:12};
const MUSIC = {
  bufs:{}, ready:false, loading:null, cur:null, key:null, muted:false, vol:1, bus:null,
  out(c){ if (!this.bus){ this.bus=c.createGain(); this.bus.gain.value=VOL.music*MIX.music; this.bus.connect(c.destination); } return this.bus; },
  load(){
    if (this.loading) return this.loading;
    const c=SFX.ensure(); if (!c) return Promise.resolve();
    this.loading = (async()=>{
      for (const [k,uri] of Object.entries(MUSIC_SRC)){
        try{
          const bin=atob(uri.slice(uri.indexOf(',')+1)); const u8=new Uint8Array(bin.length);
          for (let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
          const buf=await new Promise((ok,no)=>c.decodeAudioData(u8.buffer, ok, no));
          // skip the encoder's silent padding at both ends so loops are seamless
          const d=buf.getChannelData(0), th=.0015; let a=0, b=d.length-1;
          while (a<d.length && Math.abs(d[a])<th) a++; while (b>a && Math.abs(d[b])<th) b--;
          if (a < .02*buf.sampleRate) a=0;
          const n=Math.round((MUSIC_LOOP[k]||0)*buf.sampleRate);
          if (n && a+n<buf.length){
            const out=c.createBuffer(buf.numberOfChannels, n, buf.sampleRate);
            for (let ch=0; ch<buf.numberOfChannels; ch++){
              const src=buf.getChannelData(ch), dst=out.getChannelData(ch);
              dst.set(src.subarray(a, a+n));
              for (let i=a+n, j=0; i<buf.length && j<n; i++, j++) dst[j]+=src[i];
            }
            this.bufs[k]={buf:out, s:0, e:n/buf.sampleRate};
          } else this.bufs[k]={buf, s:a/buf.sampleRate, e:(b+1)/buf.sampleRate};
        }catch(e){}
      }
      this.ready=true; this.key=null; this.update();
    })();
    return this.loading;
  },
  // which track belongs on screen right now
  pick(){
    const sc=$('scene');
    if (sc && sc.classList.contains('title')) return ['A',true];
    if (sc && sc.classList.contains('beatific')) return this.bufs.J ? ['J',true] : ['D',false];
    if (sc && (sc.classList.contains('win')||sc.classList.contains('rest'))) return this.bufs.H ? ['H',true] : ['D',false];
    if (sc && sc.classList.contains('lose')) return this.bufs.I ? ['I',true] : ['E',false];
    if (S.phase==='shop') return ['B',true];
    if (isBoss()) return ['C',true];
    return [S.terrace>=TERRACES?'F':'G', true];
  },
  update(){ if (!this.ready) return; const [k,loop]=this.pick(); if (k!==this.key) this.play(k, loop); },
  play(k, loop=true){
    this.key=k; const c=SFX.ctx; if (!c) return; const t=c.currentTime;
    if (this.cur){ const o=this.cur; o.g.gain.cancelScheduledValues(t); o.g.gain.setValueAtTime(o.g.gain.value,t); o.g.gain.linearRampToValueAtTime(0,t+.7); try{ o.src.stop(t+.8); }catch(e){} this.cur=null; }
    const b=this.bufs[k]; if (!b || this.muted) return;
    const src=c.createBufferSource(); src.buffer=b.buf; src.loop=loop; src.loopStart=b.s; src.loopEnd=b.e;
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(this.vol,t+.8);
    src.connect(g); g.connect(this.out(c)); src.start(t, b.s, loop?undefined:b.e-b.s);
    this.cur={src,g};
  },
  // a one-off swell over the loop, which ducks underneath it
  stinger(k){
    const c=SFX.ctx, b=this.bufs[k]; if (!c || !b || this.muted) return; const t=c.currentTime, dur=b.e-b.s;
    const src=c.createBufferSource(); src.buffer=b.buf; const g=c.createGain(); g.gain.value=this.vol*1.1;
    src.connect(g); g.connect(this.out(c)); src.start(t, b.s, dur);
    if (this.cur){ const cg=this.cur.g.gain; cg.cancelScheduledValues(t); cg.setValueAtTime(cg.value,t); cg.linearRampToValueAtTime(this.vol*.2,t+.3); cg.setValueAtTime(this.vol*.2,t+dur-1); cg.linearRampToValueAtTime(this.vol,t+dur+.5); }
  },
  setMuted(m){ this.muted=m; try{ localStorage.setItem('sv_music', m?'0':'1'); }catch(e){} if (m){ this.play(null); } else { this.key=null; this.update(); } }
};

function hashStr(str){ let h=1779033703^str.length; for (let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^h>>>16)>>>0; }

// beyond a quadrillion: 1.23e15; past the largest number a computer holds: ∞
const sci = (n) => { const e=Math.floor(Math.log10(Math.abs(n))); let m=n/Math.pow(10,e); if (m>=9.995){ m/=10; return m.toFixed(2)+'e'+(e+1); } return m.toFixed(2)+'e'+e; };
const fmt = (n) => !isFinite(n) ? '∞' : Math.abs(n)>=1e15 ? sci(n) : (Math.round(n*10)/10).toLocaleString('en-US');
// compact for tight spaces: 56.3K, 1.24M, 3.1B
const fmtC = (n) => { if (!isFinite(n)) return '∞'; const a=Math.abs(n);
  if (a>=1e15) return sci(n);
  if (a>=1e12) return (n/1e12).toFixed(a>=1e13?1:2).replace(/\.0+$/,'')+'T';
  if (a>=1e9) return (n/1e9).toFixed(a>=1e10?1:2).replace(/\.0+$/,'')+'B';
  if (a>=1e6) return (n/1e6).toFixed(a>=1e7?1:2).replace(/\.0+$/,'')+'M';
  if (a>=1e5) return Math.round(n/1e3)+'K';
  if (a>=1e4) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
  return fmt(n); };

function buildBag(deckId){
  const bag=[];
  for (const L in LETTERS){
    let c = LETTERS[L][1];
    if (deckId==='hermit'){ if ('JQXZV'.includes(L)) continue; c = Math.max(1, Math.round(c*0.75)); }
    for (let i=0;i<c;i++) bag.push(letterTile(L));
  }
  if (deckId!=='hermit') bag.push(blankTile());
  const combos = deckId==='chronicler' ? ['TH','CH','EA','OO','ING','STR','QU'] : deckId==='hermit' ? ['TH'] : ['TH','ING'];
  combos.forEach(t=>bag.push(comboTile(COMBOS.find(c=>c.text===t))));
  return bag;
}

function progress(ev){
  if (S.seeded) return;
  const met=[];
  if (ev.type==='verse'){ if (/[JQXZ]/.test(ev.word)) met.push('lantern'); if (ev.total>=10000) met.push('illuminator'); if (ev.count===5) P.stats.pentads++; P.stats.best=Math.max(P.stats.best||0, isFinite(ev.total)?ev.total:Number.MAX_VALUE); }
  if (ev.type==='vigil'){ P.stats.vigils++; if (!ev.traded) met.push('hours'); if (ev.oneWord) met.push('hourglass');
    if (ev.boss){ P.stats.maxTerrace=Math.max(P.stats.maxTerrace, ev.terrace+1); met.push('hermit'); if (ev.terrace>=1) met.push('chronicler'); if (ev.terrace>=3) met.push('mirror'); if (ev.terrace>=TERRACES-1){ met.push('abbess','trumpet'); P.stats.wins++; } } }
  if (ev.type==='beatific'){ P.stats.wins++; P.stats.visions=(P.stats.visions||0)+1; met.push('abbess','trumpet'); }
  if (ev.type==='seal') P.stats.seals++;
  if (ev.type==='sell') P.stats.sells++;
  if (ev.type==='mort' && S.morts.length>=3) met.push('friar');
  for (const [id,u] of Object.entries(UNLOCKS)) if (u.prog){ const [a,b]=u.prog(P); if (a>=b) met.push(id); }

  saveProfile();
}

const mortBlocked = (m) => (m.id==='nocturne'||m.id==='grandsilence') && S.rerollsMax<=0;
function mortFatal(m){
  const verses=S.versesMax-(m.id==='discipline'?1:0)-(S.fastDebt||0)-(m.id==='fast'?1:0);
  const rack=S.handMax-(m.id==='hairshirt'?1:0);
  const bag=S.master.length-(m.id==='fast'?Math.min(4, S.master.filter(t=>!t.blank&&!t.seal).length):0);
  return verses<=0 ? 'no verses' : rack<=0 ? 'no rack' : bag<=0 ? 'an empty bag' : '';
